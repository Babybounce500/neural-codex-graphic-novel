<style>
  :root{
    --void:#0a0c0f; --ink:#e9e3d6; --ink-dim:#a9a49a; --gold:#c9a24b;
    --display:'Cinzel',Georgia,serif; --mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--void); color:var(--ink); overflow:hidden; }
  ::selection{ background:rgba(201,162,75,.5); color:#0a0c0f; }

  .slide{
    position:fixed; inset:0; opacity:0; visibility:hidden;
    transition:opacity .25s linear;
  }
  .slide.active{ opacity:1; visibility:visible; }
  .slide img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .slide::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,12,15,.05) 0%, rgba(10,12,15,.1) 55%, rgba(10,12,15,.88) 100%);
  }
  .slide .cap{
    position:absolute; left:0; right:0; bottom:9vh; z-index:2;
    text-align:center; padding:0 1.5rem;
  }
  .slide .num{
    display:inline-block; font-family:var(--mono); font-size:.72rem; letter-spacing:.2em;
    color:var(--gold); margin-bottom:.5rem;
  }
  .slide h2{
    font-family:var(--display); font-weight:600; font-size:clamp(1.5rem,4.4vw,2.6rem);
    margin:0; text-wrap:balance; text-shadow:0 2px 20px rgba(0,0,0,.7);
  }

  /* book-divider slide: no photo, just a title card between volumes */
  .slide.divider{ display:flex; align-items:center; justify-content:center; background:var(--void); }
  .slide.divider::after{ display:none; }
  .slide.divider .divider-inner{ text-align:center; padding:2rem; }
  .slide.divider .eyebrow{ font-family:var(--mono); font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-dim); }
  .slide.divider h1{
    font-family:var(--display); font-weight:600; font-size:clamp(2rem,7vw,4rem); margin:.6rem 0 0;
    color:var(--ink); text-wrap:balance;
  }
  .slide.divider .band-sub{ font-family:var(--display); font-size:clamp(1rem,2.6vw,1.3rem); color:var(--gold); letter-spacing:.08em; margin-top:.6rem; }
  .slide.divider .rule{ width:80px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:1.4rem auto; }

  .brand{
    position:fixed; top:1.1rem; left:1.3rem; z-index:5;
    font-family:var(--mono); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-dim); background:rgba(10,12,15,.5); border:1px solid rgba(233,227,214,.16);
    padding:.4rem .75rem; border-radius:3px;
  }
  .brand b{ color:var(--gold); font-weight:500; }

  .dots{ position:fixed; bottom:1.4rem; left:0; right:0; z-index:5; display:flex; justify-content:center; gap:6px; padding:0 8vw; flex-wrap:nowrap; overflow:hidden; }
  .dots span{ width:5px; height:5px; min-width:5px; border-radius:50%; background:rgba(233,227,214,.25); transition:background .2s,transform .2s; }
  .dots span.on{ background:var(--gold); transform:scale(1.5); }
  .dots span.divider-dot{ background:rgba(201,162,75,.4); width:2px; min-width:2px; border-radius:0; height:8px; align-self:center; }

  .zone{ position:fixed; top:0; bottom:0; width:34%; z-index:4; cursor:pointer; background:transparent; border:0; }
  .zone.prev{ left:0; }
  .zone.next{ right:0; }

  .counter{
    position:fixed; top:1.1rem; right:1.3rem; z-index:5;
    font-family:var(--mono); font-size:.68rem; color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }

  /* band quick-jump strip */
  .jump{
    position:fixed; top:2.9rem; left:1.3rem; z-index:5;
    display:flex; gap:4px;
  }
  .jump button{
    all:unset; cursor:pointer; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:.6rem; color:var(--ink-dim);
    border:1px solid rgba(233,227,214,.18); background:rgba(10,12,15,.4);
    transition:border-color .2s, color .2s;
  }
  .jump button:hover, .jump button.on{ border-color:var(--gold); color:var(--gold); }

  @media (max-width:560px){
    .jump{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ .slide{ transition:none; } }
</style>

  var container = document.getElementById('slides');
  var dotsWrap = document.getElementById('dots');
  var jumpWrap = document.getElementById('jump');
  var frag = document.createDocumentFragment();
  var dotFrag = document.createDocumentFragment();
  var jumpFrag = document.createDocumentFragment();

  var slideMeta = []; // { kind:'divider'|'chapter', band, bandStartIndex }
  var bandStartIndex = [];

  bands.forEach(function(b){
    bandStartIndex[b.band] = slideMeta.length;

    var divider = document.createElement('div');
    divider.className = 'slide divider';
    divider.innerHTML =
      '<div class="divider-inner">' +
        '<span class="eyebrow">Neural Codex</span>' +
        '<h1>Band ' + b.band + '</h1>' +
        '<div class="rule"></div>' +
        '<span class="band-sub">' + b.title + '</span>' +
      '</div>';
    frag.appendChild(divider);
    slideMeta.push({ kind: 'divider', band: b.band });

    var d = document.createElement('span');
    d.className = 'divider-dot';
    dotFrag.appendChild(d);

    b.chapters.forEach(function(ch, i){
      var title = ch[0], img = ch[1];
      var el = document.createElement('div');
      el.className = 'slide';
      el.innerHTML =
        '<img src="' + BASE + img + '" alt="Band ' + b.band + ', Kapitel ' + (i+1) + ': ' + title + '" loading="lazy">' +
        '<div class="cap"><span class="num">Band ' + b.band + ' · Kapitel ' + (i+1) + '</span><h2>' + title + '</h2></div>';
      frag.appendChild(el);
      slideMeta.push({ kind: 'chapter', band: b.band });

      var dot = document.createElement('span');
      dotFrag.appendChild(dot);
    });

    var jumpBtn = document.createElement('button');
    jumpBtn.textContent = b.band;
    jumpBtn.title = 'Band ' + b.band + ' · ' + b.title;
    jumpBtn.addEventListener('click', function(){ jumpToBand(b.band); });
    jumpFrag.appendChild(jumpBtn);
  });

  container.appendChild(frag);
  dotsWrap.appendChild(dotFrag);
  jumpWrap.appendChild(jumpFrag);

  var slides = container.querySelectorAll('.slide');
  var dots = dotsWrap.querySelectorAll('span');
  var jumpButtons = jumpWrap.querySelectorAll('button');
  var counter = document.getElementById('counter');
  var idx = 0;

  // eager-load the very first image only; everything else is lazy
  var firstImg = slides[1] && slides[1].querySelector('img');
  if (firstImg) firstImg.loading = 'eager';

  function render(){
    slides.forEach(function(s, i){ s.classList.toggle('active', i === idx); });
    dots.forEach(function(d, i){ d.classList.toggle('on', i === idx); });
    var meta = slideMeta[idx];
    jumpButtons.forEach(function(btn, i){ btn.classList.toggle('on', (i+1) === meta.band); });
    counter.textContent = (idx+1) + ' / ' + slides.length + '  ·  Band ' + meta.band;
  }

  function go(delta){
    var next = idx + delta;
    if (next < 0 || next > slides.length - 1) return;
    idx = next;
    render();
  }

  function jumpToBand(bandNum){
    idx = bandStartIndex[bandNum];
    render();
  }

  document.getElementById('prevZone').addEventListener('click', function(){ go(-1); });
  document.getElementById('nextZone').addEventListener('click', function(){ go(1); });

  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.key === 'ArrowRight' || e.key === ' '){ go(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ go(-1); e.preventDefault(); }
  });

  var touchX = null;
  document.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, { passive:true });
  document.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 44) go(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive:true });

  render();
})();
</script>
